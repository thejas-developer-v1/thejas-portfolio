<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thejas | Developer</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #8a2be2; /* Electric Violet */
            --text-main: #e0e0e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            border-right: 1px solid #333;
            padding: 20px;
            position: fixed;
        }
        .content {
            margin-left: 300px;
            padding: 40px;
            max-width: 800px;
        }
        .profile-name { font-size: 1.5rem; color: var(--accent-color); font-weight: bold; }
        .card {
            background: #16161a;
            border: 1px solid #333;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid var(--accent-color);
        }
        input, textarea {
            width: 100%; background: #000; border: 1px solid #444;
            color: var(--accent-color); padding: 10px; margin-bottom: 10px;
        }
        button {
            background: var(--accent-color); color: white; border: none;
            padding: 10px 20px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="profile-name">Thejas</div>
        <div style="font-size: 0.8rem; color: #8b949e;">Full Stack Operative</div>
        <nav style="margin-top: 30px;">
            <p>> /about_me</p>
            <p>> /projects</p>
            <p>> /guestbook_log</p>
        </nav>
    </div>

    <div class="content">
        <section id="about">
            <h2>> System_Info</h2>
            <p>Welcome. I am a BCA student specialized in secure systems and clean UI architecture.</p>
        </section>

        <section id="guestbook">
            <h2>> Encrypted_Transmission</h2>
            <form action="/submit-guestbook" method="POST">
                <input type="text" name="name" placeholder="Enter Codename" required>
                <textarea name="message" placeholder="Message content..." required></textarea>
                <button type="submit">SEND_DATA</button>
            </form>

            <div style="margin-top: 30px;">
                <h3>> Recent_Logs</h3>
                <div id="guestbook-entries">
                    <div class="card">System: Initializing database connection...</div>
                </div>
            </div>
        </section>
    </div>

    <script>
        async function loadEntries() {
            const response = await fetch('/guestbook-entries');
            const entries = await response.json();
            const list = document.getElementById('guestbook-entries');
            list.innerHTML = entries.map(e => `
                <div class="card">
                    <strong style="color: var(--accent-color)">${e.name}</strong>: ${e.message}
                </div>
            `).join('');
        }
        loadEntries();
    </script>
</body>
</html>
